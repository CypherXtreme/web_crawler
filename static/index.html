<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Crawler</title>
<style>
  :root {
    --bg: #EDF1F4; --panel: #FFFFFF; --ink: #12232F; --muted: #5B6B76;
    --line: #CFD8DE; --accent: #0B6E4F; --warn: #B4491F; --ok: #0B6E4F; --mid: #8A6A00;
    --serif: "Charter", "Iowan Old Style", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1A22; --panel: #16252F; --ink: #E6EEF2; --muted: #93A5B0;
            --line: #2A3C48; --accent: #4FD1A1; --warn: #F08A5D; --ok: #4FD1A1; --mid: #E3B341; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
  main { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  h1 { font: 700 clamp(2rem, 6vw, 3.2rem)/1.1 var(--serif); margin: 0 0 12px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); max-width: 52ch; margin: 0 0 32px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; }
  input { flex: 1 1 280px; padding: 14px 16px; font: inherit; color: var(--ink);
          background: var(--panel); border: 1.5px solid var(--line); border-radius: 8px; }
  button { padding: 14px 22px; font: 600 1rem var(--sans); color: #fff; background: var(--accent);
           border: 0; border-radius: 8px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #08231A; } }
  button:disabled { opacity: .6; cursor: progress; }
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); padding: 8px 14px; font-size: .9rem; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { margin: 20px 0 0; min-height: 1.5em; color: var(--muted); }
  #status.error { color: var(--warn); }
  #result { margin-top: 28px; }
  .verdict { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .verdict .label { color: var(--muted); font-size: .9rem; margin: 0; }
  .verdict .word { font: 700 clamp(2.2rem, 8vw, 3.6rem)/1.1 var(--serif); margin: 4px 0 12px; }
  .word.outdated { color: var(--warn); } .word.needs-work { color: var(--mid); } .word.modern { color: var(--ok); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  h2 { font: 700 1.2rem var(--serif); margin: 0 0 10px; }
  h3 { font-size: .95rem; margin: 14px 0 4px; color: var(--muted); font-weight: 600; }
  ul { margin: 0; padding-left: 1.2em; } li { margin: 4px 0; }
  .empty { color: var(--muted); margin: 0; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .meta span { overflow-wrap: anywhere; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Site Crawler</h1>
  <p class="lede">Enter a website address to see what the business offers, how to contact them, and whether the site looks dated.</p>

  <form id="form">
    <input id="url" type="text" inputmode="url" placeholder="example.com" aria-label="Website address" required autofocus>
    <button id="go" type="submit">Analyze site</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="result"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), statusEl = $("status"), resultEl = $("result"), btn = $("go");
let lastReport = null;

function el(tag, props = {}, ...kids) {
  const node = Object.assign(document.createElement(tag), props);
  kids.flat().forEach(k => node.append(k));
  return node;
}
function list(items) {
  return items && items.length ? el("ul", {}, items.map(i => el("li", { textContent: String(i) })))
                               : el("p", { className: "empty", textContent: "None found." });
}
function block(title, ...content) { return el("section", {}, el("h2", { textContent: title }), ...content); }

function render(report) {
  resultEl.replaceChildren();
  const a = report.analysis || {};

  resultEl.append(el("div", { className: "meta" },
    el("span", { textContent: report.url + " · " + report.date }),
    el("button", { className: "ghost", type: "button", textContent: "Download JSON", onclick: download })
  ));

  if (a.raw) { resultEl.append(block("Analysis", el("pre", { textContent: a.raw }))); return; }

  const d = a.design_assessment || {};
  const verdict = (d.verdict || "unknown").toLowerCase();
  resultEl.append(el("div", { className: "verdict" },
    el("p", { className: "label", textContent: "Design verdict" }),
    el("p", { className: "word " + verdict.replace(/\s+/g, "-"), textContent: verdict }),
    el("p", { textContent: d.summary || "" }),
    d.issues && d.issues.length ? list(d.issues) : ""
  ));

  resultEl.append(block("Headlines", list(a.headlines)));
  resultEl.append(block("Services", list(a.services)));

  const c = a.contacts || {};
  resultEl.append(block("Contact details",
    el("h3", { textContent: "Emails" }), list(c.emails),
    el("h3", { textContent: "Phone numbers" }), list(c.phones),
    el("h3", { textContent: "Calls to action" }), list(c.calls_to_action)
  ));
}

function download() {
  const blob = new Blob([JSON.stringify(lastReport, null, 2)], { type: "application/json" });
  const link = el("a", { href: URL.createObjectURL(blob), download: "site-analysis.json" });
  link.click(); URL.revokeObjectURL(link.href);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  btn.disabled = true; btn.textContent = "Analyzing…";
  statusEl.className = ""; statusEl.textContent = "Crawling the page and analyzing it. This takes 10–30 seconds.";
  resultEl.replaceChildren();
  try {
    const res = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong.");
    lastReport = data; statusEl.textContent = "";
    render(data);
  } catch (err) {
    statusEl.className = "error"; statusEl.textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Analyze site";
  }
});
</script>
</body>
</html>
