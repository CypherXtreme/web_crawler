services:
  - type: web
    name: site-crawler
    runtime: python
    buildCommand: pip install -r requirements.txt && crawl4ai-setup
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
